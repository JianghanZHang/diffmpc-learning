[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "diffmpc_learning"
version = "0.1.0"
description = "Research package: Gradient Quality of Differentiable NMPC"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "numpy>=1.17.4",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["diffmpc_learning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/python"]
